name: release

# runs whenever a version git tag is created
on:
  push:
    tags:
      - "*.*.*" # e.g 1.0.1

permissions:
  contents: write

env:
  GH_TOKEN: ${{ github.token }}
  # lets stove know which release it is so it can look for newer ones
  STOVE_TAG: ${{ github.ref_name }}

jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: create
        run: gh release create "$GITHUB_REF_NAME" --draft --prerelease --verify-tag --title "$GITHUB_REF_NAME" --notes "# Changes"

  windows:
    needs: draft
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: build
        run: cargo build -r
      - name: upload
        shell: bash
        run: gh release upload "$GITHUB_REF_NAME" target/release/stove.exe

  macos:
    needs: draft
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: build
        run: cargo build -r
      - name: upload
        run: |
          cp target/release/stove stove-macos
          gh release upload "$GITHUB_REF_NAME" stove-macos

  linux:
    needs: draft
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: install deps
        run: |
          sudo apt-get update; sudo apt-get install pkg-config libx11-dev libasound2-dev libudev-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libwayland-dev libxkbcommon-dev libgtk-3-dev
      - name: build
        run: cargo build -r
      - name: upload
        run: |
          cp target/release/stove stove-linux
          gh release upload "$GITHUB_REF_NAME" stove-linux
